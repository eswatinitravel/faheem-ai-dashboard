# Optional. Chalane ke liye: docker compose up -d
services:
  dashboard:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:
