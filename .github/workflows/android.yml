# v3.41 Jarvis Android app: har PR par APK banta hai (check). main par banne wali APK release "jarvis-android" mein jati hai,
# jahan se laptop (lib/apk.js) usay download kar ke phone ko deta hai.
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Jarvis APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          export JARVIS_VERSION_NAME="$(node -p "require('../package.json').version")"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../jarvis.apk
          ls -la ../jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis.apk
      - name: Release (sirf main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if gh release view jarvis-android >/dev/null 2>&1; then
            gh release upload jarvis-android jarvis.apk --clobber
            gh release edit jarvis-android --title "Jarvis Android app (v$V)" --notes "Dashboard v$V ke saath bani. Laptop par Phone se jodo page se install karein."
          else
            gh release create jarvis-android jarvis.apk --title "Jarvis Android app (v$V)" --notes "Dashboard v$V ke saath bani. Laptop par Phone se jodo page se install karein." --latest=false
          fi
