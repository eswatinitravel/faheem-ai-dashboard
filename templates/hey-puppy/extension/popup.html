<!doctype html>
<html lang="ur">
<head><meta charset="utf-8"><title>Hey Puppy</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Hey Puppy</h1>
  <p id="conn" class="muted">Puppy se rabta check ho raha hai...</p>
  <label>Token (Puppy chat > Settings)<input id="token" type="password" autocomplete="off"></label>
  <button id="send">Yeh page Puppy ko bhejo</button>
  <label>Is page ke bare mein sawal<input id="q" placeholder="Is page ka khulasa batao"></label>
  <button id="ask">Poocho</button>
  <div id="answer" class="box"></div>
  <h2>Page par kaam (Allow chahiye)</h2>
  <div id="actions" class="muted">Koi kaam nahi.</div>
  <script src="popup.js"></script>
</body>
</html>
